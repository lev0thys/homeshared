name: CI

on:
  push:
    branches: [main, commit, dev]
  pull_request:
    branches: [main, commit, dev]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # La version est lue depuis `package.json` → champ `packageManager` (évite ERR_PNPM_BAD_PM_VERSION).

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @homeshared/api prisma:generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public'

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build-web:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version lue depuis `packageManager` à la racine du monorepo.

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build web (PWA)
        run: pnpm --filter @homeshared/mobile build:web
        env:
          EXPO_PUBLIC_API_URL: 'https://api.example.com'
          EXPO_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'placeholder'
