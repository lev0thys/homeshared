# Fly.io — API homeshared
# Déploiement : voir docs/DEPLOYMENT.md
app = "homeshared-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/db"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
